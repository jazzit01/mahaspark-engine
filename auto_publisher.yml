name: MahaSpark 24/7 Engine Runner

on:
  schedule:
    # Runs automatically every 10 minutes
    - cron: '*/10 * * * *'
  # Allows manual triggering from the GitHub interface
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests gspread playwright
          playwright install --with-deps chromium

      - name: Reconstruct Credentials
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "$GCP_CREDS" > credentials.json
          mkdir -p output assets/images

      - name: Execute News Processor
        run: python sheet_processor.py
