<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: transparent;
      font-family: 'Mukta', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Base Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    /* Seamless full-height left scrim that blends naturally into the cyber theme */
    .theme-scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(3, 7, 18, 0.94) 0%,
        rgba(3, 7, 18, 0.88) 52%,
        rgba(3, 7, 18, 0.50) 74%,
        transparent 100%
      );
      z-index: 2;
    }

    /* Safe-zone Layout:
       Top: 310px (clears baked-in MahaSpark logo & tagline)
       Left: 110px (clears red neon edge accents)
       Right: 190px (clears Instagram like/comment/share icons)
       Bottom: 260px (clears Reels audio/profile drawer)
    */
    .wrapper {
      position: relative;
      z-index: 10;
      width: 1080px;
      height: 1920px;
      padding: 310px 190px 260px 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* Top Category Badge (Stationary with BG) */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: 28px;
    }

    .news-badge {
      background: linear-gradient(135deg, #E63946 0%, #9B111E 100%);
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
      padding: 6px 22px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(230, 57, 70, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* Content Area */
    .content-area {
      max-width: 780px;
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    /* Massive Editorial Headline */
    .headline-box {
      display: flex;
      flex-direction: column;
      line-height: 1.08;
      margin-bottom: 24px;
    }

    .headline-white {
      color: #FFFFFF;
      font-size: 100px;
      font-weight: 900;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.95);
      letter-spacing: -1px;
    }

    .headline-yellow {
      color: #FFC000;
      font-size: 112px;
      font-weight: 900;
      text-shadow: 0 4px 35px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 192, 0, 0.4);
      letter-spacing: -1px;
    }

    /* Sleek Cyber Neon Hook Pill */
    .hook-pill-container {
      margin-bottom: 30px;
      display: flex;
    }

    .hook-pill {
      background: rgba(255, 192, 0, 0.10);
      border: 1.5px solid rgba(255, 192, 0, 0.65);
      border-left: 6px solid #FFC000;
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 800;
      padding: 8px 22px;
      border-radius: 4px 12px 12px 4px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(255, 192, 0, 0.25);
    }

    .yellow-divider {
      width: 140px;
      height: 4px;
      background: linear-gradient(90deg, #FFC000 0%, #FF8C00 80%, transparent 100%);
      border-radius: 2px;
      margin-bottom: 36px;
      box-shadow: 0 0 14px rgba(255, 192, 0, 0.6);
    }

    /* Two Large Focused Bullets */
    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 34px;
      width: 100%;
    }

    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .bullet-icon {
      font-size: 38px;
      line-height: 1.25;
      flex-shrink: 0;
      color: #FFC000;
      filter: drop-shadow(0 0 12px rgba(255, 192, 0, 0.7));
    }

    .bullet-text {
      color: #F1F5F9;
      font-size: 38px;
      font-weight: 700;
      line-height: 1.35;
      flex-grow: 1;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.95);
    }

    .bullet-text span.hl,
    .bullet-text .hl {
      color: #FFC000;
      font-weight: 900;
    }

    /* Layer Isolation Rules for Multi-Plate Video Compositing */
    body.mode-bg .headline-box,
    body.mode-bg .hook-pill-container,
    body.mode-bg .yellow-divider,
    body.mode-bg .bullet-list { visibility: hidden !important; }

    body.mode-hl .bg-image,
    body.mode-hl .theme-scrim,
    body.mode-hl .header-bar,
    body.mode-hl .hook-pill-container,
    body.mode-hl .yellow-divider,
    body.mode-hl .bullet-list { visibility: hidden !important; }

    body.mode-pill .bg-image,
    body.mode-pill .theme-scrim,
    body.mode-pill .header-bar,
    body.mode-pill .headline-box,
    body.mode-pill .yellow-divider,
    body.mode-pill .bullet-list { visibility: hidden !important; }

    body.mode-b1 .bg-image,
    body.mode-b1 .theme-scrim,
    body.mode-b1 .header-bar,
    body.mode-b1 .headline-box,
    body.mode-b1 .hook-pill-container,
    body.mode-b1 .yellow-divider,
    body.mode-b1 #bullet-1 { visibility: hidden !important; }

    body.mode-b2 .bg-image,
    body.mode-b2 .theme-scrim,
    body.mode-b2 .header-bar,
    body.mode-b2 .headline-box,
    body.mode-b2 .hook-pill-container,
    body.mode-b2 .yellow-divider,
    body.mode-b2 #bullet-0 { visibility: hidden !important; }
  </style>
</head>
<body class="mode-all">

  <img id="bg-img" class="bg-image" src="" alt="Background" />
  <div class="theme-scrim"></div>

  <div class="wrapper">
    <div class="header-bar">
      <div class="news-badge" id="badge-tag">मोठी बातमी</div>
    </div>

    <div class="content-area">
      <div class="headline-box">
        <div class="headline-white" id="hl-part1"></div>
        <div class="headline-yellow" id="hl-part2"></div>
      </div>

      <div class="hook-pill-container">
        <div class="hook-pill" id="hook-pill"></div>
      </div>

      <div class="yellow-divider"></div>

      <div class="bullet-list" id="bullet-list"></div>
    </div>
  </div>

</body>
</html>
