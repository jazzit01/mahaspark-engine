<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: #030712;
      font-family: 'Mukta', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Background Visual Photo */
    .bg-image {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
      z-index: 1;
    }

    /* 2. Deep Black Left Gradient (45–50% solid coverage for text legibility) */
    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(3, 7, 18, 0.98) 0%,
        rgba(3, 7, 18, 0.95) 46%,
        rgba(3, 7, 18, 0.72) 58%,
        rgba(3, 7, 18, 0.20) 78%,
        rgba(3, 7, 18, 0.0) 100%
      );
      z-index: 2;
    }

    .top-bottom-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(3, 7, 18, 0.85) 0%,
        transparent 18%,
        transparent 72%,
        rgba(3, 7, 18, 0.98) 100%
      );
      z-index: 3;
    }

    /* 3. Main Layout Wrapper */
    .wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      padding: 90px 75px 60px 75px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Header */
    .header-area {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
    }

    .brand-logo {
      height: 145px;
      width: auto;
      max-width: 320px;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.8));
    }

    .news-badge {
      background: linear-gradient(135deg, #E63946 0%, #BA181B 100%);
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 800;
      padding: 8px 28px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(230, 57, 70, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Body / Content Area with Generous Spacing */
    .content-area {
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin-top: -20px;
      text-align: left;
    }

    /* Headline: Scaled +30% with Heavy Hierarchy */
    .headline-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .headline-white {
      color: #FFFFFF;
      font-size: 114px;
      font-weight: 900;
      line-height: 1.15;
      text-shadow: 0 5px 30px rgba(0, 0, 0, 0.95);
      letter-spacing: -1px;
    }

    .headline-yellow {
      color: #FFC000;
      font-size: 132px;
      font-weight: 900;
      line-height: 1.12;
      text-shadow: 0 6px 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(255, 192, 0, 0.3);
      letter-spacing: -1px;
    }

    .hook-pill {
      align-self: flex-start;
      background: rgba(255, 192, 0, 0.12);
      border: 1.5px solid rgba(255, 192, 0, 0.6);
      border-left: 8px solid #FFC000;
      color: #FFFFFF;
      font-size: 36px;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 6px 14px 14px 6px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    /* Direct Bullets (Glass Cards Removed, Direct Placement on Dark Canvas) */
    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 34px;
      margin-top: 10px;
      width: 100%;
      max-width: 650px;
    }

    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    /* Yellow Glowing Bullet Icons */
    .bullet-icon {
      font-size: 38px;
      line-height: 1.25;
      flex-shrink: 0;
      color: #FFC000;
      filter: drop-shadow(0 0 10px rgba(255, 192, 0, 0.5));
    }

    /* Bullet Typography: Scaled +20% */
    .bullet-text {
      color: #F1F5F9;
      font-size: 38px;
      font-weight: 700;
      line-height: 1.38;
      flex-grow: 1;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
    }

    /* Highlight Key Words in Yellow */
    .bullet-text span.hl,
    .bullet-text .hl {
      color: #FFC000;
      font-weight: 900;
    }

    /* 4. Professional Social Footer Bar */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 20px 32px;
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-icons-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .social-svg {
      width: 38px;
      height: 38px;
      fill: #FFFFFF;
      opacity: 0.95;
    }

    .handle-text {
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-left: 6px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFC000;
      color: #030712;
      font-size: 26px;
      font-weight: 900;
      padding: 10px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(255, 192, 0, 0.35);
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <img id="bg-img" class="bg-image" src="" alt="Background" />
  <div class="gradient-overlay"></div>
  <div class="top-bottom-vignette"></div>

  <!-- Content Layer -->
  <div class="wrapper">
    <div class="header-area">
      <img id="logo-img" class="brand-logo" src="" alt="MahaSpark" />
      <div class="news-badge" id="badge-tag">सायबर सुरक्षा</div>
    </div>

    <div class="content-area">
      <div class="headline-box">
        <div class="headline-white" id="hl-part1">बँक ऑफ बडोदाचा</div>
        <div class="headline-yellow" id="hl-part2">मोठा डेटा लीक!</div>
      </div>

      <div class="hook-pill" id="hook-pill">1TB संवेदनशील डेटा डार्क वेबवर?</div>

      <div class="bullet-list" id="bullet-list">
        <!-- Bullets injected dynamically -->
      </div>
    </div>

    <!-- Social Media Call-To-Action Footer -->
    <div class="footer-bar">
      <div class="footer-left">
        <div class="social-icons-group">
          <!-- Instagram SVG -->
          <svg class="social-svg" viewBox="0 0 24 24">

          </svg>
          <!-- YouTube SVG -->
          <svg class="social-svg" viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <!-- Facebook SVG -->
          <svg class="social-svg" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </div>
        <span class="handle-text">@MAHASPARKOFFICIAL</span>
      </div>

      <div class="footer-right">
        <span>Follow & Subscribe</span>
      </div>
    </div>
  </div>

</body>
</html>
