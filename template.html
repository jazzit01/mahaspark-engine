<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: transparent;
      font-family: 'Mukta', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Background Photo (Clean & Focused) */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      display: block;
      filter: brightness(0.7) contrast(1.1);
    }

    /* Modern Soft Scrim - ONLY visible in Full mode or with Background */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, 
        rgba(0,0,0,0.4) 0%, 
        rgba(0,0,0,0) 25%, 
        rgba(0,0,0,0.1) 50%, 
        rgba(0,0,0,0.8) 100%);
      z-index: 2;
    }

    .broadcast-container {
      position: relative;
      z-index: 10;
      width: 1080px;
      height: 1920px;
      padding: 95px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar: Minimal & Modern */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 240px;
    }

    .brand-logo {
      height: 110px;
      width: auto;
    }

    .news-badge {
      background: #D90429;
      color: #FFFFFF;
      font-size: 30px;
      font-weight: 900;
      padding: 8px 24px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Headlines: Clean Typography, NO Shadows */
    .headline-wrap {
      display: flex;
      flex-direction: column;
      margin-bottom: 50px;
    }

    .headline-part1 {
      color: #FFFFFF;
      font-size: 110px;
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -2px;
    }

    .headline-part2 {
      font-size: 130px;
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -3px;
      margin-top: 10px;
    }

    /* Color Themes */
    body.theme-yellow .headline-part2 { color: #FFC000; }
    body.theme-yellow .hook-pill { border-left-color: #FFC000; }
    body.theme-yellow .bullet-icon { background: #FFC000; }
    body.theme-yellow .hl { color: #FFC000; }

    body.theme-red .headline-part2 { color: #FF4D4D; }
    body.theme-red .hook-pill { border-left-color: #FF4D4D; }
    body.theme-red .bullet-icon { background: #FF4D4D; }
    body.theme-red .hl { color: #FF4D4D; }

    /* Modern Glass Hook Pill */
    .hook-pill-wrap {
      margin-bottom: 60px;
    }

    .hook-pill {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 10px solid #FFC000;
      padding: 15px 30px;
      font-size: 34px;
      font-weight: 800;
      border-radius: 0 8px 8px 0;
      display: inline-block;
      color: #FFFFFF;
    }

    /* Professional Bullet Points */
    .bullet-wrap {
      display: flex;
      flex-direction: column;
      gap: 45px;
    }

    .bullet-row {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    /* Pro Icon: A sleek geometric bar instead of Emoji */
    .bullet-icon {
      width: 12px;
      height: 50px;
      background: #FFC000;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .bullet-text {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.95);
    }

    .bullet-text span.hl {
      font-weight: 900;
    }

    .bullet-text span.hl,
    .bullet-text .hl {
      font-weight: 800;
    }

    /* Multi-Plate Capture Modes */
    /* 1. Raw photo only: Keeps bg-image 100% visible and block-level */
    body.mode-raw-bg .bg-image { display: block !important; }
    body.mode-raw-bg .top-bar,
    body.mode-raw-bg .editorial-content { display: none !important; }

    /* 2. Fixed Frame Only: bg-image removed completely, frame rendered on transparent base */
    body.mode-frame .bg-image { display: none !important; }
    body.mode-frame .editorial-content { display: none !important; }

    /* 3. Text Overlays - CLEAN transparent captures, no gradients */
    body.mode-hl .bg-image,
    body.mode-hl .bg-overlay,
    body.mode-hl .top-bar,
    body.mode-hl .hook-pill-wrap,
    body.mode-hl .broadcast-divider,
    body.mode-hl .bullet-wrap { visibility: hidden !important; }

    body.mode-pill .bg-image,
    body.mode-pill .bg-overlay,
    body.mode-pill .top-bar,
    body.mode-pill .headline-wrap,
    body.mode-pill .broadcast-divider,
    body.mode-pill .bullet-wrap { visibility: hidden !important; }

    body.mode-b1 .bg-image,
    body.mode-b1 .bg-overlay,
    body.mode-b1 .top-bar,
    body.mode-b1 .headline-wrap,
    body.mode-b1 .hook-pill-wrap,
    body.mode-b1 .broadcast-divider,
    body.mode-b1 #bullet-1 { visibility: hidden !important; }

    body.mode-b2 .bg-image,
    body.mode-b2 .bg-overlay,
    body.mode-b2 .top-bar,
    body.mode-b2 .headline-wrap,
    body.mode-b2 .hook-pill-wrap,
    body.mode-b2 .broadcast-divider,
    body.mode-b2 #bullet-0 { visibility: hidden !important; }
  </style>
</head>
<body class="mode-all theme-yellow">

  <!-- Background Photo (Only plate that moves) -->
  <img id="bg-img" class="bg-image" src="" alt="Background" />
  <div class="bg-overlay"></div>

  <!-- Fixed Broadcast UI -->
  <div class="broadcast-container">
    <div class="top-bar">
      <img id="logo-img" class="brand-logo" src="" alt="MahaSpark" />
      <div class="news-badge" id="badge-tag">मोठी बातमी</div>
    </div>

    <!-- Editorial Text Content -->
    <div class="editorial-content">
      <div class="headline-wrap">
        <div class="headline-part1" id="hl-part1"></div>
        <div class="headline-part2" id="hl-part2"></div>
      </div>

      <div class="hook-pill-wrap">
        <div class="hook-pill" id="hook-pill"></div>
      </div>

      <div class="broadcast-divider"></div>

      <div class="bullet-wrap" id="bullet-list"></div>
    </div>
  </div>

</body>
</html>
