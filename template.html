<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: transparent;
      font-family: 'Mukta', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Base Background Graphic */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    /* Safe-zone Layout:
       Top: 110px (clears Instagram top Reels bar)
       Left: 85px (clears curved mobile bezels)
       Right: 180px (clears Reels right interaction icons)
       Bottom: 260px (clears Reels profile & caption area)
    */
    .wrapper {
      position: relative;
      z-index: 10;
      width: 1080px;
      height: 1920px;
      padding: 110px 180px 260px 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Header Bar: Bold Brand Logo on Left, Badge on Right */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 190px;
    }

    /* Prominent, large brand logo */
    .brand-logo {
      height: 185px;
      width: auto;
      max-width: 440px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.95)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
    }

    .news-badge {
      background: linear-gradient(135deg, #E63946 0%, #9B111E 100%);
      color: #FFFFFF;
      font-size: 30px;
      font-weight: 800;
      padding: 8px 26px;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(230, 57, 70, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* Main Content Body */
    .content-area {
      max-width: 780px;
      display: flex;
      flex-direction: column;
      text-align: left;
      margin-bottom: auto;
      padding-top: 35px;
    }

    /* Headline with High-Impact Contrast Shadows (No Background Box) */
    .headline-box {
      display: flex;
      flex-direction: column;
      line-height: 1.08;
      margin-bottom: 24px;
    }

    .headline-white {
      color: #FFFFFF;
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -0.5px;
      /* Heavy triple-layer drop shadows for maximum legibility */
      text-shadow: 
        0 4px 10px rgba(0, 0, 0, 1),
        0 8px 30px rgba(0, 0, 0, 0.95),
        0 14px 45px rgba(0, 0, 0, 0.85);
    }

    .headline-yellow {
      color: #FFC000;
      font-size: 108px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 
        0 4px 10px rgba(0, 0, 0, 1),
        0 8px 32px rgba(0, 0, 0, 0.95),
        0 0 35px rgba(255, 192, 0, 0.45);
    }

    /* Hook Pill with Subtle Neon Edge */
    .hook-pill-container {
      margin-bottom: 28px;
      display: flex;
    }

    .hook-pill {
      background: rgba(15, 23, 42, 0.75);
      border: 1.5px solid rgba(255, 192, 0, 0.7);
      border-left: 6px solid #FFC000;
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 800;
      padding: 8px 22px;
      border-radius: 4px 12px 12px 4px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 192, 0, 0.25);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .yellow-divider {
      width: 150px;
      height: 5px;
      background: linear-gradient(90deg, #FFC000 0%, #FF8C00 85%, transparent 100%);
      border-radius: 2px;
      margin-bottom: 34px;
      box-shadow: 0 0 16px rgba(255, 192, 0, 0.7);
    }

    /* 2 Focused Bullets with Heavy Shadows */
    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 100%;
    }

    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      width: 100%;
    }

    .bullet-icon {
      font-size: 38px;
      line-height: 1.22;
      flex-shrink: 0;
      color: #FFC000;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 12px rgba(255, 192, 0, 0.8));
    }

    .bullet-text {
      color: #F8FAFC;
      font-size: 38px;
      font-weight: 700;
      line-height: 1.35;
      flex-grow: 1;
      text-shadow: 
        0 4px 10px rgba(0, 0, 0, 1),
        0 6px 25px rgba(0, 0, 0, 0.95),
        0 10px 35px rgba(0, 0, 0, 0.85);
    }

    .bullet-text span.hl,
    .bullet-text .hl {
      color: #FFC000;
      font-weight: 900;
      text-shadow: 0 0 20px rgba(255, 192, 0, 0.5);
    }

    /* Layer Isolation Rules for Multi-Plate Video Engine */
    body.mode-bg .headline-box,
    body.mode-bg .hook-pill-container,
    body.mode-bg .yellow-divider,
    body.mode-bg .bullet-list { visibility: hidden !important; }

    body.mode-hl .bg-image,
    body.mode-hl .header-bar,
    body.mode-hl .hook-pill-container,
    body.mode-hl .yellow-divider,
    body.mode-hl .bullet-list { visibility: hidden !important; }

    body.mode-pill .bg-image,
    body.mode-pill .header-bar,
    body.mode-pill .headline-box,
    body.mode-pill .yellow-divider,
    body.mode-pill .bullet-list { visibility: hidden !important; }

    body.mode-b1 .bg-image,
    body.mode-b1 .header-bar,
    body.mode-b1 .headline-box,
    body.mode-b1 .hook-pill-container,
    body.mode-b1 .yellow-divider,
    body.mode-b1 #bullet-1 { visibility: hidden !important; }

    body.mode-b2 .bg-image,
    body.mode-b2 .header-bar,
    body.mode-b2 .headline-box,
    body.mode-b2 .hook-pill-container,
    body.mode-b2 .yellow-divider,
    body.mode-b2 #bullet-0 { visibility: hidden !important; }
  </style>
</head>
<body class="mode-all">

  <img id="bg-img" class="bg-image" src="" alt="Background" />

  <div class="wrapper">
    <div class="header-bar">
      <img id="logo-img" class="brand-logo" src="" alt="MahaSpark" />
      <div class="news-badge" id="badge-tag">मोठी बातमी</div>
    </div>

    <div class="content-area">
      <div class="headline-box">
        <div class="headline-white" id="hl-part1"></div>
        <div class="headline-yellow" id="hl-part2"></div>
      </div>

      <div class="hook-pill-container">
        <div class="hook-pill" id="hook-pill"></div>
      </div>

      <div class="yellow-divider"></div>

      <div class="bullet-list" id="bullet-list"></div>
    </div>
  </div>

</body>
</html>
