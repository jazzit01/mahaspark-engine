<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: transparent;
      font-family: 'Mukta', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Background Photo (Only plate that zooms) */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      display: block;
    }

    /* 2. Studio Scrim: Keeps the background photo authentic while providing text contrast */
    .studio-scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: linear-gradient(
        180deg,
        rgba(7, 10, 20, 0.70) 0%,
        rgba(7, 10, 20, 0.25) 25%,
        rgba(7, 10, 20, 0.75) 55%,
        rgba(7, 10, 20, 0.95) 100%
      );
      z-index: 2;
    }

    /* 3. Broadcast Container */
    .broadcast-container {
      position: relative;
      z-index: 10;
      width: 1080px;
      height: 1920px;
      padding: 95px 120px 240px 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* Top Bar: Fixed at top, with 145px space below to push text into the reading sweet spot */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 120px;
      margin-bottom: 180px;
    }

    .brand-logo {
      height: 110px;
      width: auto;
      max-width: 360px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
    }

    .news-badge {
      background: #D90429;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
      padding: 7px 22px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(217, 4, 41, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
    }

    /* Editorial Text Content Area */
    .editorial-content {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    /* Headline: Proper line heights with 36px breathing room below */
    .headline-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      margin-bottom: 40px;
    }

    .headline-part1 {
      color: #FFFFFF;
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95);
    }

    .headline-part2 {
      font-size: 90px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95);
    }

    /* Color Themes */
    body.theme-yellow .headline-part2 { color: #FFC000; }
    body.theme-yellow .hook-pill { border-left: 5px solid #FFC000; }
    body.theme-yellow .broadcast-divider { background: #FFC000; }
    body.theme-yellow .bullet-icon { color: #FFC000; }
    body.theme-yellow .bullet-text span.hl, body.theme-yellow .bullet-text .hl { color: #FFC000; }

    body.theme-red .headline-part2 { color: #EF4444; }
    body.theme-red .hook-pill { border-left: 5px solid #EF4444; }
    body.theme-red .broadcast-divider { background: #EF4444; }
    body.theme-red .bullet-icon { color: #EF4444; }
    body.theme-red .bullet-text span.hl, body.theme-red .bullet-text .hl { color: #EF4444; }

    body.theme-white .headline-part2 { color: #FFFFFF; }
    body.theme-white .hook-pill { border-left: 5px solid #FFFFFF; }
    body.theme-white .broadcast-divider { background: #FFFFFF; }
    body.theme-white .bullet-icon { color: #FFFFFF; }
    body.theme-white .bullet-text span.hl, body.theme-white .bullet-text .hl { color: #FFC000; }

    /* Context Hook Pill */
    .hook-pill-wrap {
      margin-bottom: 24px;
      display: flex;
    }

    .hook-pill {
      background: rgba(15, 23, 42, 0.82);
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 0 6px 6px 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left-width: 5px;
    }

    .broadcast-divider {
      width: 120px;
      height: 4px;
      border-radius: 2px;
      margin-bottom: 34px;
    }

    /* Bullet Points: 28px gap for clean separation */
    .bullet-wrap {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
    }

    .bullet-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
    }

    .bullet-icon {
      font-size: 32px;
      line-height: 1.3;
      flex-shrink: 0;
    }

    .bullet-text {
      color: #F8FAFC;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.36;
      flex-grow: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .bullet-text span.hl,
    .bullet-text .hl {
      font-weight: 800;
    }

    /* Multi-Plate Capture Modes */
    /* 1. Raw photo only: Keeps bg-image 100% visible and block-level */
    body.mode-raw-bg .bg-image { display: block !important; }
    body.mode-raw-bg .studio-scrim,
    body.mode-raw-bg .top-bar,
    body.mode-raw-bg .editorial-content { display: none !important; }

    /* 2. Fixed Frame Only: bg-image removed completely, frame rendered on transparent base */
    body.mode-frame .bg-image { display: none !important; }
    body.mode-frame .editorial-content { display: none !important; }

    /* 3. Text Overlays */
    body.mode-hl .bg-image,
    body.mode-hl .studio-scrim,
    body.mode-hl .top-bar,
    body.mode-hl .hook-pill-wrap,
    body.mode-hl .broadcast-divider,
    body.mode-hl .bullet-wrap { visibility: hidden !important; }

    body.mode-pill .bg-image,
    body.mode-pill .studio-scrim,
    body.mode-pill .top-bar,
    body.mode-pill .headline-wrap,
    body.mode-pill .broadcast-divider,
    body.mode-pill .bullet-wrap { visibility: hidden !important; }

    body.mode-b1 .bg-image,
    body.mode-b1 .studio-scrim,
    body.mode-b1 .top-bar,
    body.mode-b1 .headline-wrap,
    body.mode-b1 .hook-pill-wrap,
    body.mode-b1 .broadcast-divider,
    body.mode-b1 #bullet-1 { visibility: hidden !important; }

    body.mode-b2 .bg-image,
    body.mode-b2 .studio-scrim,
    body.mode-b2 .top-bar,
    body.mode-b2 .headline-wrap,
    body.mode-b2 .hook-pill-wrap,
    body.mode-b2 .broadcast-divider,
    body.mode-b2 #bullet-0 { visibility: hidden !important; }
  </style>
</head>
<body class="mode-all theme-yellow">

  <!-- Background Photo (Only plate that moves) -->
  <img id="bg-img" class="bg-image" src="" alt="Background" />

  <!-- Fixed Broadcast Scrim & UI -->
  <div class="studio-scrim"></div>

  <div class="broadcast-container">
    <div class="top-bar">
      <img id="logo-img" class="brand-logo" src="" alt="MahaSpark" />
      <div class="news-badge" id="badge-tag">मोठी बातमी</div>
    </div>

    <!-- Editorial Text Content -->
    <div class="editorial-content">
      <div class="headline-wrap">
        <div class="headline-part1" id="hl-part1"></div>
        <div class="headline-part2" id="hl-part2"></div>
      </div>

      <div class="hook-pill-wrap">
        <div class="hook-pill" id="hook-pill"></div>
      </div>

      <div class="broadcast-divider"></div>

      <div class="bullet-wrap" id="bullet-list"></div>
    </div>
  </div>

</body>
</html>
