<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@600;700;800;900&family=Outfit:wght@700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: #030712;
      font-family: 'Mukta', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Background Visual Photo */
    .bg-image {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: right;
      filter: brightness(0.92) contrast(1.08);
    }

    /* 2. Deep Black Left Gradient (48% solid coverage for pristine legibility) */
    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(3, 7, 18, 0.98) 0%,
        rgba(3, 7, 18, 0.95) 48%,
        rgba(3, 7, 18, 0.70) 60%,
        rgba(3, 7, 18, 0.20) 80%,
        rgba(3, 7, 18, 0.0) 100%
      );
      z-index: 2;
    }

    .top-bottom-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(3, 7, 18, 0.85) 0%,
        transparent 16%,
        transparent 75%,
        rgba(3, 7, 18, 0.95) 100%
      );
      z-index: 3;
    }

    /* 3. Main Editorial Layout Wrapper */
    .wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      padding: 90px 75px 80px 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Header Area */
    .header-area {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
    }

    .brand-logo {
      height: 140px;
      width: auto;
      max-width: 320px;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.8));
    }

    .news-badge {
      background: linear-gradient(135deg, #E63946 0%, #BA181B 100%);
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 800;
      padding: 8px 28px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(230, 57, 70, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Body / Content Area */
    .content-area {
      max-width: 750px;
      display: flex;
      flex-direction: column;
      text-align: left;
      margin-top: 10px;
    }

    /* Headline: Scaled +12-15% further with Heavy Visual Hierarchy */
    .headline-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 24px;
    }

    .headline-white {
      color: #FFFFFF;
      font-size: 128px;
      font-weight: 900;
      line-height: 1.10;
      text-shadow: 0 5px 30px rgba(0, 0, 0, 0.95);
      letter-spacing: -1.5px;
    }

    .headline-yellow {
      color: #FFC000;
      font-size: 148px;
      font-weight: 900;
      line-height: 1.08;
      text-shadow: 0 6px 35px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 192, 0, 0.35);
      letter-spacing: -1.5px;
    }

    .hook-pill {
      align-self: flex-start;
      background: rgba(255, 192, 0, 0.12);
      border: 1.5px solid rgba(255, 192, 0, 0.6);
      border-left: 8px solid #FFC000;
      color: #FFFFFF;
      font-size: 36px;
      font-weight: 800;
      padding: 10px 24px;
      border-radius: 6px 14px 14px 6px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 36px;
    }

    /* Thin Yellow Divider between Headline & Bullets */
    .yellow-divider {
      width: 180px;
      height: 5px;
      background: linear-gradient(90deg, #FFC000 0%, #FFA500 70%, transparent 100%);
      border-radius: 3px;
      margin-bottom: 40px;
      box-shadow: 0 0 12px rgba(255, 192, 0, 0.5);
    }

    /* Direct Bullets Section */
    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: 100%;
      max-width: 660px;
    }

    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .bullet-icon {
      font-size: 40px;
      line-height: 1.2;
      flex-shrink: 0;
      color: #FFC000;
      filter: drop-shadow(0 0 12px rgba(255, 192, 0, 0.6));
    }

    /* Bullet Font Size Scaled Up Slightly (Max 2 Lines per bullet) */
    .bullet-text {
      color: #F1F5F9;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.30;
      flex-grow: 1;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .bullet-text span.hl,
    .bullet-text .hl {
      color: #FFC000;
      font-weight: 900;
    }

    /* Minimal Editorial Watermark Footer (Clean Press Look) */
    .footer-editorial {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 20px;
    }

    .footer-brand-text {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .footer-brand-text span {
      color: #FFC000;
    }

    .footer-sub {
      font-size: 20px;
      font-weight: 600;
      color: #94A3B8;
      border-left: 2px solid rgba(255, 255, 255, 0.25);
      padding-left: 14px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <img id="bg-img" class="bg-image" src="" alt="Background" />
  <div class="gradient-overlay"></div>
  <div class="top-bottom-vignette"></div>

  <!-- Content Layer -->
  <div class="wrapper">
    <div class="header-area">
      <img id="logo-img" class="brand-logo" src="" alt="MahaSpark" />
      <div class="news-badge" id="badge-tag">सायबर सुरक्षा</div>
    </div>

    <div class="content-area">
      <div class="headline-box">
        <div class="headline-white" id="hl-part1">बँक ऑफ बडोदाचा</div>
        <div class="headline-yellow" id="hl-part2">मोठा डेटा लीक!</div>
      </div>

      <div class="hook-pill" id="hook-pill">1TB संवेदनशील डेटा डार्क वेबवर?</div>

      <!-- Thin Yellow Divider -->
      <div class="yellow-divider"></div>

      <div class="bullet-list" id="bullet-list">
        <!-- Bullets injected dynamically -->
      </div>
    </div>

    <!-- Editorial Clean Footer (No Social Buttons) -->
    <div class="footer-editorial">
      
    </div>
  </div>

</body>
</html>
