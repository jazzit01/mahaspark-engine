name: MahaSpark News Bulletin (16:9, YouTube)

# Separate from the hourly reel workflow, which is unchanged. One job renders the whole bulletin
# (ten stories, one Remotion render) to keep GitHub Actions minutes low.
concurrency:
  group: mahaspark-bulletin
  cancel-in-progress: false

on:
  schedule:
    # 07:00 IST = 01:30 UTC and 17:00 IST = 11:30 UTC. GitHub may start a run a few minutes late.
    - cron: '30 1 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  produce-bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Remotion browser (Chrome Headless Shell)
        uses: actions/cache@v4
        with:
          path: remotion/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}

      - name: Cache Playwright browsers
        # Kept as requested. The pipeline no longer uses Playwright, so this stays empty unless it is added back.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install system libraries (Chrome dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
            libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 \
            libpango-1.0-0 libcairo2 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Remotion dependencies and browser
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Run unit tests
        run: python -m pytest -q

      - name: Inject Credentials & Output Folders
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDS" > credentials.json
          mkdir -p out

      - name: Run Bulletin (RSS, ten items, Gemini TTS, photos, Remotion render, YouTube, Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # YouTube upload (OAuth refresh token with the youtube.upload scope). Unset = render only, video kept as artifact.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          BULLETIN_ITEMS: ${{ vars.BULLETIN_ITEMS }}
        run: python scripts/bulletin.py

      - name: Keep the bulletin video (2 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulletin
          path: |
            out/mahaspark_bulletin.mp4
            remotion/public/bulletin.json
          if-no-files-found: ignore
          retention-days: 2
