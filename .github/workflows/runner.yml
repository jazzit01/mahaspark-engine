name: MahaSpark 24/7 Cloud Processor

on:
  schedule:
    # Runs automatically every 10 minutes, 24/7/365
    - cron: '*/10 * * * *'
  # Allows instant manual trigger from GitHub UI anytime
  workflow_dispatch:

jobs:
  process-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests gspread playwright feedparser
          playwright install --with-deps chromium

      - name: Inject Credentials & Output Folders
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDS" > credentials.json
          mkdir -p output assets/images

      - name: Run Processing Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sheet_processor.py
