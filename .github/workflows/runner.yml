name: MahaSpark Prime-Time Reel Pipeline

concurrency:
  group: mahaspark-pipeline
  cancel-in-progress: false

on:
  schedule:
    # Hourly, daytime only: 05:00 to 20:00 IST (16 runs a day). GitHub cron is UTC; IST = UTC+5:30, so
    # 05:00 IST = 23:30 UTC the day before and 06:00-20:00 IST = 00:30-14:30 UTC. One full Whisper + Remotion
    # render takes several minutes, so shorter intervals would queue up. GitHub may start a run a few minutes late.
    - cron: '30 23 * * *'
    - cron: '30 0-14 * * *'
  workflow_dispatch:

jobs:
  produce-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Remotion browser (Chrome Headless Shell)
        uses: actions/cache@v4
        with:
          path: remotion/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}

      - name: Cache Playwright browsers
        # Kept as requested. The pipeline no longer uses Playwright, so this stays empty unless it is added back.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-${{ runner.os }}-v1

      - name: Install system libraries (Chrome dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
            libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 \
            libpango-1.0-0 libcairo2 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Remotion dependencies and browser
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Run unit tests
        run: python -m pytest -q

      - name: Inject Credentials & Output Folders
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDS" > credentials.json
          mkdir -p out

      - name: Run Pipeline (RSS, 5W1H script, Gemini TTS, alignment, Remotion render, Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Extra keys from OTHER Google Cloud projects (comma separated); used when one key's quota is spent.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # Stock footage per scene (free key from pexels.com/api). Unset = studio backgrounds only.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Optional overrides (Settings > Secrets and variables > Actions > Variables tab).
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Last-resort script writers if Gemini's quota runs out. Unset secrets are empty and skipped.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/pipeline.py

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug
          path: |
            remotion/public/story.json
            out/*.mp4
          if-no-files-found: ignore
          retention-days: 3
