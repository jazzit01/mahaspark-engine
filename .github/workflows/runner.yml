name: MahaSpark News

concurrency:
  group: mahaspark-news-publishing
  cancel-in-progress: false

on:
  schedule:
    # Top of each IST hour. The Python dispatcher selects configured news slots;
    # outside those slots only daytime vertical news runs.
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  publishing-window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
      time: ${{ steps.window.outputs.time }}
    steps:
      - name: Check IST publishing window
        id: window
        env:
          NEWS_PUBLISH_HOURS_IST: ${{ vars.NEWS_PUBLISH_HOURS_IST }}
        run: |
          python3 - <<'PYTHON'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          hours = [int(value) for value in (os.getenv("NEWS_PUBLISH_HOURS_IST") or "08,12,16,20").split(",")]
          if len(hours) != len(set(hours)) or not 1 <= len(hours) <= 4 or any(not 0 <= hour <= 23 for hour in hours):
              raise SystemExit("NEWS_PUBLISH_HOURS_IST must have one to four distinct hours (0–23).")
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          hour = now.hour
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"run={str(hour in hours or 5 <= hour <= 20).lower()}", file=output)
              print(f"time={now.isoformat()}", file=output)
          PYTHON

  produce-news:
    needs: publishing-window
    if: needs.publishing-window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Remotion browser (Chrome Headless Shell)
        uses: actions/cache@v4
        with:
          path: remotion/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}

      - name: Cache Playwright browsers
        # Kept as requested. The pipeline no longer uses Playwright, so this stays empty unless it is added back.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-${{ runner.os }}-v1

      - name: Install system libraries (Chrome dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
            libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 \
            libpango-1.0-0 libcairo2 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Remotion dependencies and browser
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Run unit tests
        run: python -m pytest -q

      - name: Inject Credentials & Output Folders
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDS" > credentials.json
          mkdir -p out

      - name: Run news slot or vertical pipeline
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Extra keys from OTHER Google Cloud projects (comma separated); used when one key's quota is spent.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          NEWS_PUBLISH_HOURS_IST: ${{ vars.NEWS_PUBLISH_HOURS_IST }}
          NEWS_DISPATCH_TIME: ${{ needs.publishing-window.outputs.time }}
          YOUTUBE_UPLOAD_SHORTS: ${{ vars.YOUTUBE_UPLOAD_SHORTS || '0' }}
          YOUTUBE_UPLOAD_REELS: ${{ vars.YOUTUBE_UPLOAD_REELS }}
          YOUTUBE_SYNTHETIC_FLAG: ${{ vars.YOUTUBE_SYNTHETIC_FLAG }}
          # Stock footage per scene (free key from pexels.com/api). Unset = studio backgrounds only.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Optional overrides (Settings > Secrets and variables > Actions > Variables tab).
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Last-resort script writers if Gemini's quota runs out. Unset secrets are empty and skipped.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Instagram is PAUSED on purpose. To resume, replace 'false' with ${{ vars.ENABLE_INSTAGRAM }} (and set that variable to 'true').
          ENABLE_INSTAGRAM: 'false'
          # Facebook Page Reels (9:16 Shorts only) are posted only when the repository variable ENABLE_FACEBOOK is 'true'.
          ENABLE_FACEBOOK: ${{ vars.ENABLE_FACEBOOK }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/news.py --scheduled

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug
          path: |
            remotion/public/story.json
            out/*.mp4
          if-no-files-found: ignore
          retention-days: 3
