name: MahaSpark Quiz (16:9, YouTube, script approval)

# Two manual steps (you approve the script before any video is made):
#   1) Run workflow with step = draft (optionally your own topic): the script is written to approvals/, sent to Telegram,
#      and you can read and edit it on GitHub (the link is in the Telegram message).
#   2) Run workflow with step = produce and file = the approvals/... path: voice, render, YouTube upload, Telegram.
# A cron-job.org trigger without inputs can only draft (step defaults to draft), never publish.
concurrency:
  group: mahaspark-quiz
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      step:
        description: "draft = write the script for you to check, produce = make the video from the approved file"
        type: choice
        options: [draft, produce]
        default: draft
      topic:
        description: "(draft) your topic, e.g. शिवनेरी किल्ला. Empty = the next unused topic from the list"
        required: false
        default: ""
      url:
        description: "(draft) optional article link to use as reference"
        required: false
        default: ""
      file:
        description: "(produce) the approved file, e.g. approvals/quiz-20261120-103000.txt"
        required: false
        default: ""

jobs:
  produce-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code (latest main, so your edits are included)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the inputs
        env:
          STEP: ${{ inputs.step }}
          FILE_INPUT: ${{ inputs.file }}
        run: |
          if [ "$STEP" = "produce" ]; then
            if [ -z "$FILE_INPUT" ] || [ ! -f "$FILE_INPUT" ]; then
              echo "::error::step = produce needs file = the approved script path (for example approvals/quiz-20261120-103000.txt). It must exist in the repository."
              exit 1
            fi
          fi

      - name: Set up Python 3.12 (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node 22
        if: inputs.step == 'produce'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        if: inputs.step == 'produce'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Remotion browser (Chrome Headless Shell)
        if: inputs.step == 'produce'
        uses: actions/cache@v4
        with:
          path: remotion/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('remotion/package.json', 'remotion/package-lock.json') }}

      - name: Cache Playwright browsers
        if: inputs.step == 'produce'
        # Kept as requested. The pipeline no longer uses Playwright, so this stays empty unless it is added back.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install system libraries (Chrome dependencies)
        if: inputs.step == 'produce'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
            libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 \
            libpango-1.0-0 libcairo2 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Remotion dependencies and browser
        if: inputs.step == 'produce'
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Run unit tests
        run: python -m pytest -q

      - name: Inject Credentials & Output Folders
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDS" > credentials.json
          mkdir -p out

      - name: Draft the script (Gemini, Wikipedia) and notify Telegram
        if: inputs.step == 'draft'
        env:
          DRAFT_DIR: approvals
          TOPIC: ${{ inputs.topic }}
          URL_INPUT: ${{ inputs.url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Extra keys from OTHER Google Cloud projects (comma separated); used when one key's quota is spent.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # YouTube upload (OAuth refresh token with the youtube.upload scope). Unset = render only, video kept as artifact.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
        run: python scripts/quiz.py draft --topic "$TOPIC" --url "$URL_INPUT"

      - name: Save the draft to the repository (you edit it there)
        if: inputs.step == 'draft'
        run: |
          git config user.name "mahaspark-bot"
          git config user.email "mahaspark-bot@users.noreply.github.com"
          git add approvals
          git commit -m "Quiz script draft for approval" || { echo "Nothing to save"; exit 1; }
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Make the video from the approved script (voice, render, YouTube, Telegram)
        if: inputs.step == 'produce'
        env:
          FILE_INPUT: ${{ inputs.file }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Extra keys from OTHER Google Cloud projects (comma separated); used when one key's quota is spent.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # YouTube upload (OAuth refresh token with the youtube.upload scope). Unset = render only, video kept as artifact.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
        run: python scripts/quiz.py produce "$FILE_INPUT"

      - name: Keep the video (2 days)
        if: always() && inputs.step == 'produce'
        uses: actions/upload-artifact@v4
        with:
          name: quiz
          path: |
            out/mahaspark_long.mp4
            remotion/public/long.json
          if-no-files-found: ignore
          retention-days: 2
